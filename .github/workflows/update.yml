name: Update bonus data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bonus-data
  cancel-in-progress: false

jobs:
  update-bonuses:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and parse bonus data
        run: python scraper.py

      - name: Commit changed bonus data
        run: |
          if git diff --quiet -- bonuses.json; then
            echo "bonuses.json has not changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bonuses.json
          git commit -m "Update bonus data"
          git push